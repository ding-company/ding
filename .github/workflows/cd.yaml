name: Build and Publish + Open k8s PR
on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMG: dingwan0331/ding
    steps:
      - uses: actions/checkout@v3

      - name: Set TAG (short sha)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build (Gradle)
        run: ./gradlew clean build -x test

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          docker build -t $IMG:${IMAGE_TAG} .
          docker push $IMG:${IMAGE_TAG}
          docker push $IMG:latest || true

      - name: Wait for image availability (retry)
        run: |
          for i in $(seq 1 6); do
            if docker pull $IMG:${IMAGE_TAG}; then
              echo "image available"; break
            fi
            echo "waiting for registry... ($i)"
            sleep 5
          done

      - name: Checkout k8s repo
        uses: actions/checkout@v3
        with:
          repository: ding-company/deployment
          token: ${{ secrets.GH_PAT }}
          path: deployment

      - name: Create / update branch and update image tag
        run: |
          cd deployment
          BRANCH=update-spring-${IMAGE_TAG}
          git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/ding-company/deployment.git
          # create or update branch
          if git ls-remote --exit-code --heads origin ${BRANCH}; then
            git fetch origin ${BRANCH}
            git checkout ${BRANCH}
          else
            git checkout -b ${BRANCH}
          fi
          # replace image in overlays/patches.yaml (경로는 본인 repo 기준으로 변형)
          sed -i "s|image: .*spring-app:.*|image: ${IMG}:${IMAGE_TAG}|" deployment/ding/overlays/patches.yaml
          git add deployment/ding/overlays/patches.yaml
          git commit -m "chore: update spring-app image to ${IMAGE_TAG}" || echo "no changes"
          git push --set-upstream origin ${BRANCH}

      - name: Create PR (if not exists)
        env:
          GH_API_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          BRANCH=update-spring-${IMAGE_TAG}
          PR_CHECK=$(curl -s -H "Authorization: token $GH_API_TOKEN" \
            "https://api.github.com/repos/ding-company/deployment/pulls?head=ding-company:${BRANCH}&state=open")
          if [ "$(echo "$PR_CHECK" | jq 'length')" = "0" ]; then
            PR_JSON=$(jq -n --arg t "chore: update spring-app image to ${IMAGE_TAG}" \
                         --arg h "${BRANCH}" --arg b "main" \
                         '{title:$t, head:$h, base:$b, body:"automated image update"}')
            curl -s -X POST -H "Authorization: token $GH_API_TOKEN" \
              -d "$PR_JSON" https://api.github.com/repos/ding-company/deployment/pulls
            echo "PR created"
          else
            echo "PR already exists, updated branch"
          fi
