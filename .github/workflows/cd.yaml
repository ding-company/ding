name: Build and Publish + Open k8s PR

on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMG: dingwan0331/ding

    permissions:
      contents: write
      pull-requests: write

    steps:
      # 1. Checkout main repo
      - name: Checkout main repo
        uses: actions/checkout@v3
        with:
          path: main-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Checkout deployment repo
      - name: Checkout deployment repo
        uses: actions/checkout@v3
        with:
          repository: ding-company/deployment
          path: deployment-repo
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Git config (봇 계정으로 커밋)
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      # 4. Set TAG (short sha)
      - name: Set TAG
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      # 5. Set up JDK 21
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      # 6. Build (Gradle)
      - name: Build
        run: |
          cd main-repo
          ./gradlew clean build -x test

      # 7. Docker login
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 8. Build and push image
      - name: Build and push image
        run: |
          cd main-repo
          docker build -t $IMG:${IMAGE_TAG} .
          docker push $IMG:${IMAGE_TAG}
          docker push $IMG:latest || true

      # 9. Wait for image availability
      - name: Wait for image availability
        run: |
          for i in $(seq 1 6); do
            if docker pull $IMG:${IMAGE_TAG}; then
              echo "image available"; break
            fi
            echo "waiting for registry... ($i)"
            sleep 5
          done

      # 10. Update deployment repo YAML
      - name: Update image tag in deployment repo
        run: |
          cd deployment-repo
          BRANCH=update-ding-${IMAGE_TAG}
          
          # create or update branch
          if git ls-remote --exit-code --heads origin ${BRANCH}; then
            git fetch origin ${BRANCH}
            git checkout ${BRANCH}
          else
            git checkout -b ${BRANCH}
          fi
          
          # update yaml with new image tag
          yq -i ".spec.template.spec.containers[0].image = \"${IMG}:${IMAGE_TAG}\"" ding/overlays/patches.yaml
          
          git add ding/overlays/patches.yaml
          
          if git diff-index --quiet HEAD --; then
            echo "No changes in patches.yaml, skipping commit and push."
          else
            git commit -m "chore: update ding image to ${IMAGE_TAG}"
            git push --set-upstream origin ${BRANCH}
            echo "Changes pushed"
          fi

      # 11. Create PR if not exists
      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=update-ding-${IMAGE_TAG}

          PR_CHECK=$(gh pr list \
            --repo ding-company/deployment \
            --head "${BRANCH}" \
            --state open \
            --json number)

          if [ "$(echo "$PR_CHECK" | jq 'length')" = "0" ]; then
            echo "No open PR found. Creating a new one."
            gh pr create \
              --repo ding-company/deployment \
              --head "${BRANCH}" \
              --base main \
              --title "chore: update ding image to ${IMAGE_TAG}" \
              --body "Automated image update"
          else
            echo "PR already exists"
          fi
