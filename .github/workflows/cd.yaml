name: Build and Publish + Open k8s PR
on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMG: dingwan0331/ding
    steps:
      - name: Checkout both repos
        uses: actions/checkout@v3
        with:
          # 메인 저장소 체크아웃
          path: main-repo
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/checkout@v3
        with:
          # deployment 저장소를 다른 경로에 체크아웃
          repository: ding-company/deployment
          token: ${{ secrets.GH_TOKEN }}
          path: deployment-repo

      - name: Configure Git for commits
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Set TAG (short sha)
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Build (Gradle)
        run: |
          cd main-repo
          ./gradlew clean build -x test

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        run: |
          cd main-repo
          docker build -t $IMG:${IMAGE_TAG} .
          docker push $IMG:${IMAGE_TAG}
          docker push $IMG:latest || true

      - name: Wait for image availability (retry)
        run: |
          for i in $(seq 1 6); do
            if docker pull $IMG:${IMAGE_TAG}; then
              echo "image available"; break
            fi
            echo "waiting for registry... ($i)"
            sleep 5
          done

      - name: Create / update branch and update image tag
        run: |
          cd deployment-repo
          BRANCH=update-ding-${IMAGE_TAG}
          git remote set-url origin https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/ding-company/deployment.git
          
          # Create or update branch
          if git ls-remote --exit-code --heads origin ${BRANCH}; then
            git fetch origin ${BRANCH}
            git checkout ${BRANCH}
          else
            git checkout -b ${BRANCH}
          fi
          
          # Replace image tag in the YAML file
          sed -i "s|image: .*ding:.*|image: ${IMG}:${IMAGE_TAG}|" ding/overlays/patches.yaml
          
          # Check for changes before committing and pushing
          git add ding/overlays/patches.yaml
          
          # Check if a file was actually added to the index
          if git diff-index --quiet HEAD --; then
            echo "No changes in patches.yaml, skipping commit and push."
          else
            git commit -m "chore: update ding image to ${IMAGE_TAG}"
            git push --set-upstream origin ${BRANCH}
            echo "New changes found and pushed."
          fi

      - name: Create PR (if not exists)
        env:
          GH_API_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          BRANCH=update-ding-${IMAGE_TAG}
          PR_CHECK=$(curl -s -H "Authorization: token $GH_API_TOKEN" \
            "https://api.github.com/repos/ding-company/deployment/pulls?head=ding-company:${BRANCH}&state=open")
          if [ "$(echo "$PR_CHECK" | jq 'length')" = "0" ]; then
            PR_JSON=$(jq -n --arg t "chore: update ding image to ${IMAGE_TAG}" \
                         --arg h "${BRANCH}" --arg b "main" \
                         '{title:$t, head:$h, base:$b, body:"automated image update"}')
            curl -s -X POST -H "Authorization: token $GH_API_TOKEN" \
              -d "$PR_JSON" https://api.github.com/repos/ding-company/deployment/pulls
            echo "PR created"
          else
            echo "PR already exists, updated branch"
          fi
