server:
  port: 8000

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB_NAME}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        type:
          preferred_uuid_jdbc_type: char
  redis:
    connection:
      host: localhost
      port: 6379
      timeout: 2000ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
      group-id:
        user: user-service-group
        point: point-service-group

# TODO 환경변수
jwt:
  secret: very-secret-key
  otp-token-validity: 5m
  pre-auth-token-validity: 10m
  access-token-validity: 30m
  refresh-token-validity: 14d
  refresh-token-absolute-validity: 30d

event:
  topics:
    auth: auth.events
    term: term.events
    user: user.events
    payment: payment.events
    customer: customer.events
# 환경변수
otp:
  expiry:
    otp-session: 5m
    verified-identity: 60m

security:
  expiry:
    otp-retry-track: 10m
    otp-block: 60m
    otp-blacklist: 30d
